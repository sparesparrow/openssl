name: "OpenSSL CodeQL Configuration"

# CodeQL configuration for OpenSSL security analysis
# This file customizes the CodeQL analysis for OpenSSL-specific patterns

# Disable queries that are not relevant for OpenSSL
disable-default-queries: false

# Custom query suites
queries:
  # Use security-and-quality for comprehensive security analysis
  - uses: security-and-quality

  # Custom queries for OpenSSL-specific patterns
  - name: custom-openssl-queries
    uses: ./.github/codeql/custom-queries

# Paths to exclude from analysis
paths-ignore:
  - "**/test/**"
  - "**/tests/**"
  - "**/demos/**"
  - "**/fuzz/**"
  - "**/external/**"
  - "**/doc/**"
  - "**/apps/**"
  - "**/engines/**"
  - "**/providers/legacy/**"

# Paths to include in analysis (focus on core crypto/ssl code)
paths:
  - "crypto/**"
  - "ssl/**"
  - "include/**"
  - "providers/fips/**"
  - "providers/default/**"

# Analysis configuration
packs:
  - codeql/cpp-queries

# Build configuration
build-mode: "autobuild"

# Memory settings for large codebase
memory: "8192"

# Timeout settings
timeout: "3600"
