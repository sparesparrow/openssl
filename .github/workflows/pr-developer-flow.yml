name: PR Developer Flow Check

on:
    pull_request:
        branches: [main, master]
        paths:
            - "conanfile.py"
            - "CMakeLists.txt"
            - "src/**"
            - "include/**"
            - "apps/**"

jobs:
    check-developer-flow:
        uses: ./.github/workflows/reusable-developer-flow.yml
        with:
            base_ref: ${{ github.base_ref }}
            head_ref: ${{ github.head_ref }}
            enforce_version_bump: true
