name: Conan Integration Test

on:
  push:
    branches: [ master, main ]
    paths:
      - 'conanfile.py'
      - 'test_package/**'
      - '.github/workflows/conan-integration-test.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'conanfile.py'
      - 'test_package/**'
      - '.github/workflows/conan-integration-test.yml'

jobs:
  conan-test:
    name: Conan Package Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]
        shared: [True, False]
        fips: [True, False]
        exclude:
          # Reduce matrix size for faster CI
          - os: windows-latest
            fips: true  # FIPS testing primarily on Linux
          - os: macos-latest
            fips: true  # FIPS testing primarily on Linux
          - build_type: Debug
            shared: false  # Focus on Release builds
          - build_type: Debug
            fips: true  # Focus on Release builds

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install conan
        conan --version

    - name: Configure Conan
      run: |
        conan profile detect --force
        conan remote add conancenter https://center.conan.io || true

    - name: Cache Conan packages
      uses: actions/cache@v3
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.shared }}-${{ matrix.fips }}-${{ hashFiles('conanfile.py') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.shared }}-${{ matrix.fips }}-
          conan-${{ runner.os }}-

    - name: Create package
      run: |
        conan create . --name=openssl --version=4.0.0-dev \
          --build missing \
          -o shared=${{ matrix.shared }} \
          -o enable_fips=${{ matrix.fips }} \
          -s build_type=${{ matrix.build_type }}

    - name: Test package locally
      run: |
        conan test test_package test_openssl/4.0.0-dev@user/stable \
          -s build_type=${{ matrix.build_type }}

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: conan-test-results-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.shared }}-${{ matrix.fips }}
        path: |
          ~/.conan2/p/
          test_package/build/
          test_package/CMakeFiles/

  fips-validation:
    name: FIPS Module Validation
    runs-on: ubuntu-latest
    needs: conan-test

    strategy:
      matrix:
        fips_mode: [True, False]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install conan

    - name: Configure Conan
      run: |
        conan profile detect --force
        conan remote add conancenter https://center.conan.io || true

    - name: Build FIPS package
      if: matrix.fips_mode == true
      run: |
        conan create . --name=openssl --version=4.0.0-dev \
          --build missing \
          -o shared=True \
          -o enable_fips=True \
          -s build_type=Release

    - name: Validate FIPS functionality
      run: |
        # This would validate FIPS module integrity
        # For now, just check that FIPS mode can be enabled
        echo "FIPS validation placeholder - would check FIPS module integrity"

  integration-test:
    name: Consumer Integration Test
    runs-on: ubuntu-latest
    needs: conan-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install conan

    - name: Configure Conan
      run: |
        conan profile detect --force

    - name: Test consumer project
      run: |
        mkdir consumer_test
        cd consumer_test
        cat > conanfile.py << EOF
        from conan import ConanFile
        from conan.tools.cmake import CMake

        class ConsumerConan(ConanFile):
            settings = "os", "compiler", "build_type", "arch"
            requires = "openssl/4.0.0-dev@user/stable"
            generators = "CMakeDeps", "CMakeToolchain"

            def build(self):
                cmake = CMake(self)
                cmake.configure()
                cmake.build()
        EOF

        cat > CMakeLists.txt << EOF
        cmake_minimum_required(VERSION 3.15)
        project(consumer_test)

        find_package(openssl REQUIRED)

        add_executable(test_consumer main.cpp)
        target_link_libraries(test_consumer openssl::openssl)
        EOF

        cat > main.cpp << EOF
        #include <iostream>
        #include <openssl/ssl.h>

        int main() {
            std::cout << "OpenSSL version: " << OpenSSL_version(OPENSSL_VERSION) << std::endl;
            SSL_library_init();
            std::cout << "SSL library initialized successfully!" << std::endl;
            return 0;
        }
        EOF

        conan install . --build missing
        conan build .

  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: conan-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install conan

    - name: Configure Conan
      run: |
        conan profile detect --force

    - name: Run performance tests
      run: |
        conan create . --name=openssl --version=4.0.0-dev \
          --build missing \
          -o shared=True \
          -s build_type=Release

        # Basic performance validation
        echo "Performance test placeholder - would run actual benchmarks"
