name: version-bump-guard

on:
    pull_request:
        branches: [main, master]

jobs:
    require-version-bump:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Check version bump in conanfile.py
              run: |
                  set -e
                  if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^conanfile.py$'; then
                    echo "No conanfile.py change detected; ensuring no source changes that require bump"
                    exit 0
                  fi
                  before=$(git show origin/${{ github.base_ref }}:conanfile.py | sed -n 's/^\s*version\s*=\s*\"\(.*\)\"/\1/p' | head -n1 || true)
                  after=$(sed -n 's/^\s*version\s*=\s*\"\(.*\)\"/\1/p' conanfile.py | head -n1 || true)
                  echo "Base version: $before"
                  echo "PR   version: $after"
                  if [ -z "$after" ] || [ "$before" = "$after" ]; then
                    echo "Version was not bumped in conanfile.py" >&2
                    exit 1
                  fi
                  echo "Version bump detected."
