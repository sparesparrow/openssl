name: Reusable Developer Flow Check

on:
    workflow_call:
        inputs:
            base_ref:
                description: "Base branch for comparison"
                required: true
                type: string
            head_ref:
                description: "Head branch for comparison"
                required: true
                type: string
            enforce_version_bump:
                description: "Enforce version bump for conanfile.py changes"
                required: false
                type: boolean
                default: true

jobs:
    developer-flow-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check version bump requirement
              if: ${{ inputs.enforce_version_bump == true }}
              run: |
                  set -e
                  echo "Checking for version bump in conanfile.py..."

                  # Check if conanfile.py was changed
                  if ! git diff --name-only ${{ inputs.base_ref }}...${{ inputs.head_ref }} | grep -q '^conanfile.py$'; then
                    echo "No conanfile.py change detected; ensuring no source changes that require bump"
                    exit 0
                  fi

                  # Get version from base and head
                  before=$(git show ${{ inputs.base_ref }}:conanfile.py | sed -n 's/^\s*version\s*=\s*\"\(.*\)\"/\1/p' | head -n1 || true)
                  after=$(sed -n 's/^\s*version\s*=\s*\"\(.*\)\"/\1/p' conanfile.py | head -n1 || true)

                  echo "Base version: $before"
                  echo "PR   version: $after"

                  if [ -z "$after" ] || [ "$before" = "$after" ]; then
                    echo "❌ Version was not bumped in conanfile.py"
                    echo ""
                    echo "To fix this:"
                    echo "1. Update the version in conanfile.py (e.g., from '3.4.1' to '3.4.2')"
                    echo "2. Commit the change"
                    echo ""
                    echo "Example:"
                    echo "  version = \"3.4.2\"  # Increment minor version"
                    exit 1
                  fi

                  echo "✅ Version bump detected: $before → $after"

            - name: Validate Conan recipe syntax
              run: |
                  echo "Validating Conan recipe syntax..."
                  python -m py_compile conanfile.py
                  echo "✅ conanfile.py syntax is valid"

            - name: Check for required files
              run: |
                  echo "Checking for required project files..."
                  required_files=("conanfile.py" "CMakeLists.txt" "README.md")
                  for file in "${required_files[@]}"; do
                    if [ ! -f "$file" ]; then
                      echo "❌ Missing required file: $file"
                      exit 1
                    fi
                  done
                  echo "✅ All required files present"

            - name: Developer flow summary
              run: |
                  echo "## 🚀 Developer Flow Check Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### ✅ Completed Checks" >> $GITHUB_STEP_SUMMARY
                  echo "- Version bump validation: ✅ Passed" >> $GITHUB_STEP_SUMMARY
                  echo "- Conan recipe syntax: ✅ Valid" >> $GITHUB_STEP_SUMMARY
                  echo "- Required files: ✅ Present" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
                  echo "1. Run local tests: \`conan create . --build=missing\`" >> $GITHUB_STEP_SUMMARY
                  echo "2. Push changes to trigger full CI pipeline" >> $GITHUB_STEP_SUMMARY
                  echo "3. Monitor workflow results in Actions tab" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Ready for merge! 🎉" >> $GITHUB_STEP_SUMMARY
