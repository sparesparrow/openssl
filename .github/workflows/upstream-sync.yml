name: Upstream Synchronization

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force synchronization even if conflicts exist'
        type: boolean
        default: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add upstream remote
        run: git remote add upstream https://github.com/openssl/openssl.git || true
      
      - name: Sync with upstream
        run: |
          git fetch upstream
          git checkout -b sync-upstream-$(date +%Y%m%d-%H%M%S)
          
          # Attempt merge
          if git merge upstream/master --no-edit; then
            echo "Clean merge successful"
          elif [[ "${{ github.event.inputs.force_sync }}" == "true" ]]; then
            git merge upstream/master -X theirs --no-edit
            echo "Force merge completed"
          else
            echo "Merge conflicts detected - manual resolution needed"
            exit 1
          fi
          
          git push origin HEAD