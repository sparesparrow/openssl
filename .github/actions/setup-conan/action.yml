name: 'Setup Conan'
description: 'Setup Conan package manager with common configuration'
inputs:
  conan-version:
    description: 'Conan version to install'
    required: false
    default: 'latest'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.9'
  add-remote:
    description: 'Add ConanCenter remote'
    required: false
    default: 'true'
  profile-name:
    description: 'Profile name to detect'
    required: false
    default: 'default'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Conan
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.conan-version }}" = "latest" ]; then
          pip install conan
        else
          pip install conan==${{ inputs.conan-version }}
        fi
        conan --version

    - name: Configure Conan
      shell: bash
      run: |
        conan profile detect --force --name ${{ inputs.profile-name }}
        if [ "${{ inputs.add-remote }}" = "true" ]; then
          conan remote add conancenter https://center.conan.io || true
          conan remote add cloudsmith https://cloudsmith.io/sparesparrow/openssl/ || true
        fi

    - name: Show Conan configuration
      shell: bash
      run: |
        echo "=== Conan Configuration ==="
        conan profile show ${{ inputs.profile-name }}
        conan remote list
        echo "=========================="
