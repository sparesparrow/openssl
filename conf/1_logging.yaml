logging:
  schema_version: '1.0'
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  handlers:
    - type: console
    - type: file
      filename: project.log
      max_bytes: 10485760  # 10MB
      backup_count: 5
  modules:
    conan: INFO
    cmake: WARNING
    build: INFO
    test: DEBUG