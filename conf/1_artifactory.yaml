artifactory:
  schema_version: '1.0'
  root: https://artifactory.example.com:443/artifactory
  user: ${ARTIFACTORY_USER}
  password: ${ARTIFACTORY_PASSWORD}
  conan_url: https://artifactory.example.com/artifactory/api/conan/project-local
  conan_name: project-conan
  conan_paths: [
    /usr/local/bin/conan
    , /opt/conan/bin/conan
    , /home/sparrow/.local/bin/conan
    , /usr/bin/conan
  ]